<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guitar Master · Interactive Game Lab</title><style>
:root{--bg:#0e0e12;--panel:#191920;--line:#2b2b35;--text:#f5f5f7;--muted:#9b9ba8;--amber:#f5a623;--orange:#e87522;--green:#25c58b;--red:#ef6262}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#25170e,#0e0e12 55%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto}.brand{color:var(--amber);letter-spacing:2px;font-weight:800;font-size:12px}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 22px}.hero h1{margin:4px 0;font-size:clamp(24px,5vw,36px)}.muted{color:var(--muted)}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile,.panel{background:linear-gradient(145deg,#202027,#15151b);border:1px solid var(--line);border-radius:17px;padding:15px}.tile{cursor:pointer;text-align:left;color:inherit;min-height:125px}.tile:hover,.tile.active{border-color:var(--amber);box-shadow:0 0 0 1px #f5a62322}.tile .emoji{font-size:28px;display:block;margin-bottom:10px}.tile b{display:block}.tile small{color:var(--muted)}.panel{margin-top:14px;min-height:340px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer;background:#292933;color:#eee}.primary{background:linear-gradient(135deg,var(--amber),var(--orange));color:#201206}.btn:disabled{opacity:.4}.question{text-align:center;font-size:20px;font-weight:750;margin:18px 0}.feedback{text-align:center;min-height:24px;color:var(--green);font-weight:700;margin:10px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{padding:15px;border:1px solid var(--line);border-radius:12px;background:#22222a;color:#fff;font-size:16px;cursor:pointer}.choice:hover{border-color:var(--amber)}.choice.good{background:#123a2d;border-color:var(--green)}.choice.bad{background:#3a1b20;border-color:var(--red)}.strings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.string{height:48px;min-width:48px;border:1px solid #777;border-radius:12px;background:#292933;color:white;font-weight:800;cursor:pointer}.string.selected{background:#f5a623;color:#241400}.fretboard{overflow-x:auto;padding:8px}.fretrow{display:grid;grid-template-columns:36px repeat(6,minmax(35px,1fr));min-width:300px}.fretrow span{display:grid;place-items:center;color:var(--muted);font-size:12px}.fret{height:40px;border:1px solid #574632;background:linear-gradient(#30271c,#211b15);position:relative;cursor:pointer}.fret:after{content:'';height:2px;background:#c7b08a;position:absolute;left:0;right:0;top:50%}.fret.hit:before{content:'●';position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--amber);font-size:24px}.pattern{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px}.slot{width:54px;height:60px;border:1px dashed #5b5b68;border-radius:12px;display:grid;place-items:center;font-size:24px;background:#22222a}.slot.filled{border-style:solid;border-color:var(--amber);color:var(--amber)}.palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.padgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:18px auto}.pad{height:75px;border-radius:16px;border:1px solid #454550;background:linear-gradient(145deg,#34343f,#22222a);color:white;font-size:26px;font-weight:800;cursor:pointer}.pad:active{transform:scale(.97)}.score{color:var(--amber);font-weight:800}.hidden{display:none}@media(max-width:500px){body{padding:12px}.panel{padding:12px}.choices{gap:7px}.choice{padding:12px 6px}}
</style></head><body><div class="wrap"><div class="brand">GUITAR MASTER 2.0 · ARCADE</div><div class="hero"><div><h1>Chơi để nhớ · Luyện để giỏi 🎸</h1><div class="muted">5 mini-game tương tác trực quan · chạy offline</div></div><div class="score">⭐ <span id="score">0</span></div></div><div class="games" id="tiles"></div><section class="panel" id="game"><div class="muted">Chọn một trò chơi phía trên để bắt đầu.</div></section><p class="muted" style="font-size:12px;margin:15px 2px">Prototype tương tác bằng chạm/kéo thả. Không giả lập nhận diện tiếng đàn hoặc microphone.</p></div>
<script>
const $=s=>document.querySelector(s);let points=0,round=0,mode='';const names=[['🎼','Xếp 6 dây','Kéo tên nốt vào dây đúng'],['🎯','Săn nốt cần đàn','Chạm vị trí nốt trên fretboard'],['🪕','Đặt ngón hợp âm','Chạm các vị trí bấm hợp âm'],['🥁','Xếp điệu đệm','Tạo mẫu quạt chả'],['⚡','Phản xạ ngón','Bấm đúng ngón theo tín hiệu']];
$('#tiles').innerHTML=names.map((x,i)=>`<button class="tile" data-mode="${i}"><span class="emoji">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></button>`).join('');$('#tiles').onclick=e=>{let b=e.target.closest('[data-mode]');if(b)start(+b.dataset.mode)};
function add(n=10){points+=n;$('#score').textContent=points}function msg(t,good=true){$('#feedback').textContent=t;$('#feedback').style.color=good?'var(--green)':'var(--red)'}
function start(m){mode=m;round=0;document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',+x.dataset.mode===m));render()}
function render(){let g=$('#game');if(mode===0){let target=['E','A','D','G','B','E'];let labels=['Mi trầm','La','Rê','Sol','Si','Mi cao'];let shuffled=[...target].sort(()=>Math.random()-.5);g.innerHTML=`<div class="topline"><b>GAME 01 · Xếp dây đàn</b><span class="muted">${round+1}/6</span></div><div class="question">Kéo nốt vào đúng thứ tự dây 6 → 1</div><div class="strings" id="drop">${target.map((n,i)=>`<button class="string" data-pos="${i}" title="Dây ${6-i}">${round>i?n:'D'+(6-i)}</button>`).join('')}</div><div class="palette">${shuffled.map(n=>`<button class="btn" draggable="true" data-note="${n}">${n}</button>`).join('')}</div><div class="feedback" id="feedback">Dây 6 là Mi trầm (E)</div><div style="text-align:center"><button class="btn primary" id="next">Kiểm tra / lượt tiếp</button></div>`;let picked=null;g.querySelectorAll('[draggable]').forEach(x=>{x.ondragstart=e=>{picked=x.dataset.note;e.dataTransfer.setData('text',picked)};x.onclick=()=>{picked=x.dataset.note;msg('Đã chọn '+picked+' · chạm ô dây để đặt')}});g.querySelectorAll('[data-pos]').forEach(x=>{x.ondragover=e=>e.preventDefault();x.ondrop=e=>{e.preventDefault();x.textContent=picked||e.dataTransfer.getData('text');x.dataset.answer=x.textContent};x.onclick=()=>{if(picked){x.textContent=picked;x.dataset.answer=picked;picked=null}}});$('#next').onclick=()=>{let ok=[...g.querySelectorAll('[data-pos]')].every((x,i)=>x.dataset.answer===target[i]);if(ok){add(10);msg('Chuẩn! Bạn đã nhớ thứ tự dây.');}else msg('Chưa đúng. Nhớ Mi–La–Rê–Sol–Si–Mi nhé.',false);round++;if(round>=6){g.innerHTML=`<div class="question">🎉 Hoàn thành game nhớ dây!</div><div class="feedback">Điểm tích lũy: ${points}</div><button class="btn primary" onclick="start(0)">Chơi lại</button>`}else setTimeout(render,650)}}
else if(mode===1){let notes=['G','A','C','D','E','B'];let note=notes[round%notes.length],str=note==='G'?3:note==='A'?5:note==='C'?2:note==='D'?4:note==='E'?1:2,fret=note==='G'?0:note==='A'?0:note==='C'?1:note==='D'?0:note==='E'?0:1;g.innerHTML=`<div class="topline"><b>GAME 02 · Săn nốt</b><span class="muted">${round+1}/6</span></div><div class="question">Tìm nốt <span style="color:var(--amber)">${note}</span> · dây ${str}</div><div class="fretboard">${[6,5,4,3,2,1].map(s=>`<div class="fretrow"><span>${s}</span>${[0,1,2,3,4,5].map(f=>`<button class="fret" data-s="${s}" data-f="${f}"></button>`).join('')}</div>`).join('')}</div><div class="feedback" id="feedback">Phím 0 là dây buông.</div>`;g.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{let ok=+x.dataset.s===str&&+x.dataset.f===fret;x.classList.add('hit');if(ok){add(10);msg('🎯 Chính xác!');round++;setTimeout(render,650)}else msg('Chưa đúng, thử vị trí khác.',false)})}
else if(mode===2){let chord=['Em','Am','C'][round%3],dots={Em:[[5,2],[4,2]],Am:[[4,2],[3,2],[2,1]],C:[[5,3],[4,2],[2,1]]}[chord];g.innerHTML=`<div class="topline"><b>GAME 03 · Đặt ngón hợp âm</b><span class="muted">${round+1}/3</span></div><div class="question">Đặt ngón để tạo hợp âm ${chord}</div><div class="fretboard">${[1,2,3,4].map(f=>`<div class="fretrow"><span>${f}</span>${[6,5,4,3,2,1].map(s=>`<button class="fret" data-s="${s}" data-f="${f}"></button>`).join('')}</div>`).join('')}</div><div class="feedback" id="feedback">Đã đặt: <span id="count">0</span>/${dots.length}</div><div style="text-align:center"><button class="btn primary" id="check">Kiểm tra hợp âm</button></div>`;let chosen=[];g.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{x.classList.toggle('hit');let a=[+x.dataset.s,+x.dataset.f];chosen.some(y=>y+''===a+'')?chosen=chosen.filter(y=>y+''!==a+''):chosen.push(a);$('#count').textContent=chosen.length});$('#check').onclick=()=>{let ok=chosen.length===dots.length&&dots.every(d=>chosen.some(c=>c[0]===d[0]&&c[1]===d[1]));if(ok){add(15);round++;msg('Hợp âm đúng!');setTimeout(()=>round>=3?start(2):render(),700)}else msg('Kiểm tra lại vị trí các ngón.',false)}}
else if(mode===3){let target=['↓','↓','↑','↑','↓','↑'];g.innerHTML=`<div class="topline"><b>GAME 04 · Xếp điệu đệm</b><span class="muted">${round+1}/3</span></div><div class="question">Tạo mẫu quạt chả 6 nhịp</div><div class="pattern" id="slots">${target.map((_,i)=>`<button class="slot" data-slot="${i}">＋</button>`).join('')}</div><div class="palette">${['↓','↑','—'].map(x=>`<button class="btn" data-val="${x}">${x==='↓'?'↓ Xuống':x==='↑'?'↑ Lên':'— Nghỉ'}</button>`).join('')}</div><div class="feedback" id="feedback">Mẫu mục tiêu: ↓ ↓ ↑ ↑ ↓ ↑</div><div style="text-align:center"><button class="btn primary" id="check">Kiểm tra</button></div>`;let vals=[];g.querySelectorAll('[data-val]').forEach(b=>b.onclick=()=>{if(vals.length<6){vals.push(b.dataset.val);g.querySelectorAll('[data-slot]')[vals.length-1].textContent=b.dataset.val;g.querySelectorAll('[data-slot]')[vals.length-1].classList.add('filled')}});$('#check').onclick=()=>{if(vals.join('')===target.join('')){add(15);round++;msg('Đúng điệu!');setTimeout(()=>round>=3?start(3):render(),650)}else msg('Chưa khớp mẫu. Xóa và thử lại.',false)}}
else {let expected=[1,2,3,4][Math.floor(Math.random()*4)];g.innerHTML=`<div class="topline"><b>GAME 05 · Phản xạ ngón</b><span class="muted">${round+1}/10</span></div><div class="question">Bấm ngón <span style="color:var(--amber);font-size:36px">${expected}</span></div><div class="padgrid">${[1,2,3,4].map(n=>`<button class="pad" data-n="${n}">${n}</button>`).join('')}</div><div class="feedback" id="feedback">Chạm đúng ngón để ghi điểm.</div>`;g.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(+b.dataset.n===expected){add(5);round++;msg('Nhanh và chính xác!');setTimeout(()=>round>=10?g.innerHTML=`<div class="question">🏆 Hoàn thành phản xạ!</div><div class="feedback">Điểm: ${points}</div><button class="btn primary" onclick="start(4)">Chơi lại</button>`:render(),350)}else msg('Sai ngón, tập trung nhé!',false)})}}
</script></body></html>
