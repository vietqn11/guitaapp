<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f13">
  <title>Guitar Master 2.0 — UI Prototype</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="statusbar"><span id="clock">9:41</span><span class="status-icons">● ● ▰</span></div>
    <header class="topbar" id="topbar">
      <button class="icon-btn back-btn hidden" id="backBtn" aria-label="Quay lại">‹</button>
      <div class="brand"><span class="brand-mark">♫</span><span>GUITAR <b>MASTER</b></span></div>
      <button class="icon-btn" id="profileQuick" aria-label="Hồ sơ">♙</button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item active" data-nav="home"><span class="nav-ico">⌂</span><span>Trang chủ</span></button>
      <button class="nav-item" data-nav="learn"><span class="nav-ico">▤</span><span>Học tập</span></button>
      <button class="nav-item" data-nav="tools"><span class="nav-ico">♫</span><span>Công cụ</span></button>
      <button class="nav-item" data-nav="progress"><span class="nav-ico">▥</span><span>Tiến độ</span></button>
    </nav>
    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot"></div>
  </div>
  <script src="data/catalog-data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
